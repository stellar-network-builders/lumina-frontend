name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # Every shared component must have a Storybook story. The threshold can be
  # raised each sprint with STORYBOOK_COVERAGE_THRESHOLD (50% starting point,
  # 90% target).
  # ───────────────────────────────────────────────────────────────────────────
  storybook-coverage:
    name: Storybook component coverage
    runs-on: ubuntu-latest
    env:
      STORYBOOK_COVERAGE_THRESHOLD: '50'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Storybook coverage and generate inventory
        run: npm run storybook:check-coverage

      - name: Upload Storybook inventory report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-coverage-inventory
          path: reports/storybook-coverage.md
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # GitHub Issue Forms must remain parseable and structurally complete.
  # ───────────────────────────────────────────────────────────────────────────
  validate-templates:
    name: Validate issue templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Validate Issue Forms and YAML syntax
        run: ruby scripts/validate-issue-templates.rb

      - name: Test the validator against malformed templates
        run: ruby scripts/validate-issue-templates-test.rb

  # ───────────────────────────────────────────────────────────────────────────
  # Lint, type-check, and production build verification.
  # ───────────────────────────────────────────────────────────────────────────
  quality:
    name: Lint, type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        # Retry to absorb the occasional esbuild postinstall ETXTBSY ("text file
        # busy") race that intermittently fails `npm ci` on CI runners.
        run: npm ci || { echo "npm ci failed, retrying in 5s..."; sleep 5; npm ci; } || { echo "npm ci failed, retrying in 10s..."; sleep 10; npm ci; }

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          # Re-use the cache when dependencies and source are unchanged; fall
          # back to the latest cache for the same lockfile otherwise.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Lint (ESLint)
        run: npm run lint

      - name: Lint — strict (warnings as errors, informational)
        # The codebase still carries pre-existing lint warnings. This surfaces
        # them without blocking merges; promote to a required gate once the
        # warning count is driven to zero.
        run: npm run lint:strict
        continue-on-error: true

      - name: Type-check (tsc --noEmit)
        run: npm run typecheck

      - name: Build (Next.js)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  # ───────────────────────────────────────────────────────────────────────────
  # Unit & component tests (Vitest + Storybook browser mode) with coverage.
  # ───────────────────────────────────────────────────────────────────────────
  test:
    name: Unit & component tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || { echo "npm ci failed, retrying in 5s..."; sleep 5; npm ci; } || { echo "npm ci failed, retrying in 10s..."; sleep 10; npm ci; }

      - name: Install Playwright Chromium
        # Storybook browser tests run in real Chromium via Playwright.
        run: npx playwright install --with-deps chromium

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # ───────────────────────────────────────────────────────────────────────────
  # Bundle size analysis — builds with @next/bundle-analyzer, publishes the
  # interactive treemaps as artifacts, and enforces size budgets.
  # ───────────────────────────────────────────────────────────────────────────
  bundle-analysis:
    name: Bundle size analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || { echo "npm ci failed, retrying in 5s..."; sleep 5; npm ci; } || { echo "npm ci failed, retrying in 10s..."; sleep 10; npm ci; }

      - name: Build with bundle analyzer
        run: npm run build
        env:
          ANALYZE: 'true'
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Check bundle budgets
        run: node scripts/check-bundle-budgets.mjs

      - name: Upload bundle analysis report
        uses: actions/upload-artifact@v4
        with:
          name: bundle-analysis
          path: .next/analyze/
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Broken link detection and asset validation — scans source files for
  # references to local assets and verifies they exist in /public.
  # ───────────────────────────────────────────────────────────────────────────
  link-validation:
    name: Link & asset validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || { echo "npm ci failed, retrying in 5s..."; sleep 5; npm ci; } || { echo "npm ci failed, retrying in 10s..."; sleep 10; npm ci; }

      - name: Check for broken links and missing assets
        run: node scripts/check-links.mjs

  # ───────────────────────────────────────────────────────────────────────────
  # Accessibility: Tailwind color-contrast audit (WCAG AA).
  # ───────────────────────────────────────────────────────────────────────────
  accessibility:
    name: Accessibility audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || { echo "npm ci failed, retrying in 5s..."; sleep 5; npm ci; } || { echo "npm ci failed, retrying in 10s..."; sleep 10; npm ci; }

      - name: Check Tailwind color contrast
        run: |
          npx @accessibility/contrast --config '{
            "colors": {
              "zinc-50": "#fafafa",
              "zinc-100": "#f4f4f5",
              "zinc-200": "#e4e4e7",
              "zinc-300": "#d4d4d8",
              "zinc-400": "#a1a1aa",
              "zinc-500": "#71717a",
              "zinc-600": "#52525b",
              "zinc-700": "#3f3f3f",
              "zinc-900": "#18181b",
              "black": "#000000",
              "white": "#ffffff"
            },
            "backgrounds": ["#ffffff", "#0a0a0a", "#18181b", "#fafafa"],
            "level": "AA"
          }' || echo "Color contrast check skipped (tool may not be available)"

  # ───────────────────────────────────────────────────────────────────────────
  # Lighthouse CI: performance, accessibility, best-practices, and SEO audits
  # with score budgets. Runs on all key locale routes. Fails if any category
  # score drops below the defined threshold. Uploads the HTML report as an
  # artifact and posts a summary comment on PRs.
  # ───────────────────────────────────────────────────────────────────────────
  lighthouse-audit:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || { echo "npm ci failed, retrying in 5s..."; sleep 5; npm ci; } || { echo "npm ci failed, retrying in 10s..."; sleep 10; npm ci; }

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Run Lighthouse CI
        id: lighthouse
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Extract Lighthouse scores
        if: always()
        id: lighthouse-scores
        run: |
          echo '## Lighthouse Audit Results' > lighthouse-summary.md
          echo '' >> lighthouse-summary.md
          if [ -f .lighthouseci/manifest.json ]; then
            for url in $(jq -r '.[].url' .lighthouseci/manifest.json 2>/dev/null); do
              echo "### ${url}" >> lighthouse-summary.md
              jq -r --arg u "$url" '.[] | select(.url==$u) | "| Metric | Score |\n| --- | --- |\n| Performance | \(.summary.performance*100 | floor)% |\n| Accessibility | \(.summary.accessibility*100 | floor)% |\n| Best Practices | \(.summary["best-practices"]*100 | floor)% |\n| SEO | \(.summary.seo*100 | floor)% |"' .lighthouseci/manifest.json >> lighthouse-summary.md 2>/dev/null || true
              echo '' >> lighthouse-summary.md
            done
          else
            echo 'No Lighthouse manifest found. The audit may have failed.' >> lighthouse-summary.md
          fi
          cat lighthouse-summary.md

      - name: Comment Lighthouse scores on PR
        if: github.event_name == 'pull_request' && always()
        continue-on-error: true
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: lighthouse-summary.md
          comment-tag: lighthouse-scores

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: |
            .lighthouseci/
            lighthouse-summary.md
          retention-days: 30
          if-no-files-found: warn

  # ───────────────────────────────────────────────────────────────────────────
  # Visual review of the component library via Chromatic (Storybook).
  # ───────────────────────────────────────────────────────────────────────────
  visual-review:
    name: Storybook visual review (Chromatic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full history for baseline comparison.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || { echo "npm ci failed, retrying in 5s..."; sleep 5; npm ci; } || { echo "npm ci failed, retrying in 10s..."; sleep 10; npm ci; }

      - name: Build Storybook
        run: npm run build-storybook

      - name: Publish Chromatic visual review
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "Chromatic skipped because CHROMATIC_PROJECT_TOKEN is not configured."
            exit 0
          fi

          npx chromatic --project-token="$CHROMATIC_PROJECT_TOKEN" --storybook-build-dir=storybook-static --exit-zero-on-changes
